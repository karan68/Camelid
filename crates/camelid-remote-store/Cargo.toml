[package]
name = "camelid-remote-store"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Durable authoritative state store for Camelid remote agent control"

[features]
default = []
test-hooks = []

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"