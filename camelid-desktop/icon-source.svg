<!-- Camelid Desktop app icon - squircle variant, transparent corners.
     Vector master for icon-source.png, icon.icns, icon.ico and the plain-size PNGs.
     The squircle sits on the Apple icon grid: 824x824 centered in the 1024 canvas
     (translate(100 100) scale(0.8046875)) with transparent margin, so the icon
     renders the same size as native apps in the Dock/Launchpad/Cmd-Tab. The
     Windows Square*Logo tiles stay full-bleed via icon-source-square.svg.
     Regenerate rasters:  rsvg-convert -w N -h N icon-source.svg -o out.png
     Full set:            tauri icon icon-source.png  (after re-exporting the 1024 PNG)
-->
