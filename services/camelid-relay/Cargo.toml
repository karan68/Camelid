[package]
name = "camelid-relay"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Blind bounded frame relay for Camelid remote agent control"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
camelid-remote-crypto = { path = "../../crates/camelid-remote-crypto" }
tempfile = "3"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"