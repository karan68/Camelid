<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Both --color-bg values (styles/tokens.css); useTheme keeps these in step
         with an explicit (non-system) theme preference after mount. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1216" />
    <title>Camelid</title>
    <script>
      // Apply the theme preference before first paint to avoid a flash. Mirrors
      // useTheme's readPreference exactly: a saved 'light'/'dark' wins; 'system'
      // leaves [data-theme] off so the prefers-color-scheme media query drives the
      // palette; anything else -- including a fresh profile with nothing saved --
      // resolves to the canonical dark default, same as useTheme will on mount.
      try {
        var t = localStorage.getItem('camelid-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        else if (t !== 'system') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
